name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas de integración (SQLite en memoria)
        run: pytest tests/ -v

      - name: Verificar migraciones de Alembic (modo offline, sin BD real)
        run: alembic -c migrations/alembic.ini upgrade head --sql > /dev/null
